title: summarize

instances:
  - url: martino.docs.buildwithfern.com
    custom-domain: summarize.martino.im
    edit-this-page:
      github:
        owner: martinopiaggi
        repo: summarize
        branch: main

# RaggioProietto palette (Raycast-derived). Light links use the darker red
# so they keep contrast on white; dark mode keeps coral.
colors:
  accent-primary:
    light: "#a52222"
    dark: "#ff7373"
  background:
    light: "#ffffff"
    dark: "#101010"
  border:
    light: "#e4e4e4"
    dark: "#242728"
  sidebar-background:
    light: "#ffffff"
    dark: "#101010"
  header-background:
    light: "#ffffff"
    dark: "#101010"
  card-background:
    light: "#f7f7f7"
    dark: "#141414"

logo:
  light: ./assets/images/logo-light.svg
  dark: ./assets/images/logo-dark.svg

css: ./assets/styles.css

navbar-links:
  - type: github
    value: https://github.com/martinopiaggi/summarize
  - type: filled
    text: Get Started
    href: /

layout:
  header-height: 4rem
  content-width: 48rem
  sidebar-width: 18rem
  searchbar-placement: header
  tabs-placement: header
  content-alignment: center

footer-links:
  github: https://github.com/martinopiaggi/summarize

navigation:
  - section: Overview
    icon: fa-solid fa-house
    contents:
      - page: Welcome
        path: ./docs/pages/welcome.mdx
      - page: How It Works
        path: ./docs/pages/how-it-works.mdx

  - section: Getting Started
    icon: fa-solid fa-rocket
    contents:
      - page: Installation
        path: ./docs/pages/getting-started/installation.mdx
      - page: Configuration
        path: ./docs/pages/getting-started/configuration.mdx

  - section: Usage
    icon: fa-solid fa-terminal
    contents:
      - page: CLI Reference
        path: ./docs/pages/usage/cli-reference.mdx
      - page: HTTP API
        path: ./docs/pages/api-reference/http-api.mdx
      - page: Summary Styles
        path: ./docs/pages/usage/summary-styles.mdx
      - page: Batch Processing
        path: ./docs/pages/usage/batch-processing.mdx
      - page: Config Management
        path: ./docs/pages/usage/config-management.mdx
      - page: Retry Behavior
        path: ./docs/pages/usage/retry-behavior.mdx
      - page: Errors and Troubleshooting
        path: ./docs/pages/usage/errors-and-troubleshooting.mdx

  - section: Features
    icon: fa-solid fa-star
    contents:
      - page: Visual Mode
        path: ./docs/pages/features/visual-mode.mdx
      - page: Transcription
        path: ./docs/pages/features/transcription.mdx
      - page: Webapp
        path: ./docs/pages/features/webapp.mdx
      - page: Caching
        path: ./docs/pages/features/caching.mdx
      - page: JEV Prefiltering
        path: ./docs/pages/features/jev-prefiltering.mdx

  - section: Integrations
    icon: fa-solid fa-plug
    contents:
      - page: Raycast
        path: ./docs/pages/integrations/raycast.mdx
      - page: Share a Summary
        path: ./docs/pages/integrations/tinypaste.mdx
      - page: Cobalt
        path: ./docs/pages/integrations/cobalt.mdx
      - page: Proxy
        path: ./docs/pages/integrations/proxy.mdx
      - page: Agent Skill
        path: ./docs/pages/integrations/agent-skill.mdx

  - section: Community
    icon: fa-solid fa-code-branch
    contents:
      - page: Contributing
        path: ./docs/pages/contributing.mdx
