# YouTube-only GUI — no Cobalt sidecar (lighter setup).
# Usage: docker compose -f docker-compose.gui-only.yml up -d
services:
  summarizer:
    image: ghcr.io/martinopiaggi/summarize:latest
    build: .
    container_name: summarizer
    ports:
      - "8501:8501"
    volumes:
      - ./summaries:/app/summaries
      - ./.env:/app/.env:ro
      - ./summarizer.yaml:/app/summarizer.yaml
    environment:
      - SUMMARIZER_KEEP_HISTORY=true
      - SUMMARIZER_CACHE_PERSIST=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3